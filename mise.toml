# Telebots — toolchain + developer tasks (mise)
#
#   mise install          install the pinned tools (bun)
#   mise tasks            list all tasks
#   mise run <task>       run a task (bare `mise run` runs the `default` task)
#   mise run check        everything CI runs — run before pushing

[tools]
# Rust is intentionally not listed here: `rust-toolchain.toml` (channel =
# "nightly") is the single source of truth for the Rust toolchain and is
# managed by rustup (CI's dtolnay/rust-toolchain action reads the same
# file). mise only manages the dashboard's JS runtime, matching
# `oven/bun:1` in monitor/Dockerfile.
bun = "1"

[env]
MONITOR_BOTS = "degen=http://localhost:9101/metrics,imagine=http://localhost:9102/metrics"

[tasks.rust-fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.rust-lint]
description = "Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Check formatting (Rust + dashboard)"
depends = ["rust-fmt", "web-fmt"]

[tasks.lint]
description = "Lint (Rust + dashboard)"
depends = ["rust-lint", "web-lint"]

[tasks.test]
description = "Run the test suite"
run = "cargo test --workspace"

[tasks.build]
description = "Build the whole workspace"
run = "cargo build --workspace"

# fmt + lint run first (in parallel across both languages); the cargo steps
# then run sequentially because they share the target dir, so parallel
# execution would just thrash on the build lock.
[tasks.check]
description = "fmt + lint + test + build — what CI runs"
depends = ["fmt", "lint"]
run = ["cargo test --workspace", "cargo build --workspace"]

[tasks.bot]
description = "Run a workspace binary locally with its dev token from .env (degen, imagine, monitor)"
usage = 'arg "<bot>" help="Workspace binary to run (degen, imagine, monitor)"'
run = "cargo run -p {{usage.bot}}"

[tasks.up]
description = "Build and (re)start the compose stack; first run provisions bots/*/.env from the .env.example templates"
run = "./scripts/up.sh"

[tasks.web]
description = "Run the dashboard dev server on :3000 (needs `mise run bot monitor` for data)"
dir = "monitor/web"
run = "bun run dev"

[tasks.web.env]
MONITOR_API_URL = "http://127.0.0.1:9110"

[tasks.web-lint]
description = "Lint the dashboard"
dir = "monitor/web"
run = "bun run lint"

[tasks.web-fmt]
description = "Check dashboard formatting (oxfmt --check)"
dir = "monitor/web"
run = "bun run fmt:check"

[tasks.logs]
description = "Follow a container's logs"
usage = 'arg "<bot>" help="Container name (degen, imagine, monitor)"'
run = "docker compose logs -f {{usage.bot}}"

[tasks.default]
description = "Run the full check (bare `mise run`)"
depends = ["check"]
