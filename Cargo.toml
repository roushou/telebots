[workspace]
resolver = "3"
members = ["bots/degen", "bots/imagine", "crates/botkit", "crates/botkit-derive", "crates/cloudflare-ai", "crates/coinmarketcap", "crates/coingecko", "crates/core", "crates/storage", "monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
botkit = { path = "crates/botkit" }
botkit-derive = { path = "crates/botkit-derive" }
cloudflare-ai = { path = "crates/cloudflare-ai" }
coinmarketcap = { path = "crates/coinmarketcap" }
coingecko = { path = "crates/coingecko" }
config = { version = "0.15", default-features = false }
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "query", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storage = { path = "crates/storage" }
telebots-core = { path = "crates/core" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "rt", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
