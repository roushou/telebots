[workspace]
resolver = "3"
members = ["bots/degen", "crates/coinmarketcap", "crates/coingecko", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
coinmarketcap = { path = "crates/coinmarketcap" }
coingecko = { path = "crates/coingecko" }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telebots-core = { path = "crates/core" }
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
