# One service per bot; see README "Deployment (VPS)" for setup and adding bots.
services:
  degen:
    build:
      context: .
      dockerfile: bots/degen/Dockerfile
    env_file: bots/degen/.env
    environment:
      TELEBOTS_METRICS_PORT: "9101"
    restart: unless-stopped

  imagine:
    build:
      context: .
      dockerfile: bots/imagine/Dockerfile
    env_file: bots/imagine/.env
    environment:
      TELEBOTS_METRICS_PORT: "9102"
      IMAGINE_DB_PATH: "/data/imagine.db"
    volumes:
      - ./data/imagine:/data
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    environment:
      MONITOR_BOTS: "degen=http://degen:9101/metrics,imagine=http://imagine:9102/metrics"
      MONITOR_DB_PATH: "/data/monitor.db"
      MONITOR_PORT: "9110"
    volumes:
      - ./data/monitor:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
