# One service per bot; see README "Deployment (VPS)" for setup and adding bots.
services:
  degen:
    build:
      context: .
      dockerfile: bots/degen/Dockerfile
    env_file: bots/degen/.env
    environment:
      TELEBOTS_METRICS_PORT: "9101"
    restart: unless-stopped

  imagine:
    build:
      context: .
      dockerfile: bots/imagine/Dockerfile
    env_file: bots/imagine/.env
    environment:
      TELEBOTS_METRICS_PORT: "9102"
      IMAGINE_DB_PATH: "/data/imagine.db"
    volumes:
      - ./data/imagine:/data
    restart: unless-stopped

  bud:
    build:
      context: .
      dockerfile: bots/bud/Dockerfile
    env_file: bots/bud/.env
    environment:
      TELEBOTS_METRICS_PORT: "9103"
      BUD_DB_PATH: "/data/bud.db"
    volumes:
      - ./data/bud:/data
    restart: unless-stopped

  remind:
    build:
      context: .
      dockerfile: bots/remind/Dockerfile
    env_file: bots/remind/.env
    environment:
      TELEBOTS_METRICS_PORT: "9104"
      REMIND_DB_PATH: "/data/remind.db"
    volumes:
      - ./data/remind:/data
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    env_file: monitor/.env
    environment:
      MONITOR_BOTS: "degen=http://degen:9101/metrics,imagine=http://imagine:9102/metrics,bud=http://bud:9103/metrics,remind=http://remind:9104/metrics"
      MONITOR_DB_PATH: "/data/monitor.db"
      MONITOR_PORT: "9110"
    volumes:
      - ./data/monitor:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
